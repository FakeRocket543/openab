<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1500" viewBox="0 0 1080 1500" font-family="'Geist','PingFang TC','Noto Sans TC',-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <style>
      .ink{fill:#1c1e26}.muted{fill:#6b6f7e}.paper{fill:#f7f6f3}.card{fill:#ffffff;stroke:#d8d6d0}
      .accent{fill:#eb6c36}.line{stroke:#d8d6d0}
      .t-title{font-size:30px;font-weight:700}.t-sub{font-size:14px}
      .t-h2{font-size:17px;font-weight:700;letter-spacing:.08em}
      .t-name{font-size:21px;font-weight:700}.t-tag{font-size:13px}
      .t-body{font-size:13.5px}.t-mono{font-family:'Geist Mono','SF Mono',Menlo,monospace;font-size:12.5px}
      .t-chip{font-size:12.5px;font-weight:600}.t-tbl{font-size:13px}.t-role{font-size:12.5px;font-weight:600}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="1080" height="1500" class="paper"/>

  <!-- Title -->
  <text x="60" y="66" class="t-title ink">Chimera × Chimera-Vite</text>
  <text x="60" y="94" class="t-sub muted">k3d openab fleet · 模型角色 / 指令 / 分工對照 · 2026-08-28 · sys101</text>
  <line x1="60" y1="114" x2="1020" y2="114" class="line"/>

  <!-- Section A: identity cards -->
  <g>
    <rect x="60" y="136" width="465" height="230" rx="10" class="card"/>
    <rect x="615" y="136" width="465" height="230" rx="10" class="card"/>
    <text x="84" y="170" class="t-name ink">lcn-chimera</text>
    <text x="84" y="192" class="t-tag muted">重裝深度 — 架構討論 · 高風險決策 · 長會談</text>
    <text x="84" y="222" class="t-mono ink">主模型 zai/glm-5.3 : max</text>
    <text x="84" y="242" class="t-mono muted">args: acp --model glm-5.3 --thinking max</text>
    <line x1="84" y1="256" x2="501" y2="256" class="line"/>
    <text x="84" y="278" class="t-body ink">max_sessions = 3 (少而深)　·　反應慢 · 成本高</text>
    <text x="84" y="300" class="t-body muted">自己就是重腦;深度不外包</text>
    <text x="84" y="330" class="t-body muted">規劃模式:/agents → Plan (max 規劃 max 執行)</text>
    <text x="84" y="352" class="t-body muted">適合「跟我一起把這件事想透」</text>

    <text x="639" y="170" class="t-name ink">lcn-chimera-vite</text>
    <text x="639" y="192" class="t-tag muted">速度優先 — 日常任務 · 快速迭代 · 分流</text>
    <text x="639" y="222" class="t-mono ink">主模型 zai/glm-5.3-flash : high</text>
    <text x="639" y="242" class="t-mono muted">args: acp --model flash --thinking high</text>
    <line x1="639" y1="256" x2="1056" y2="256" class="line"/>
    <text x="639" y="278" class="t-body ink">max_sessions = 10 (高流量)　·　反應快 · 便宜</text>
    <text x="639" y="300" class="t-body muted">深度按需:@heavy subagent (glm-5.3:max)</text>
    <text x="639" y="330" class="t-body muted">A2 已撤 → A1 flash 直答;規劃靠 /agents</text>
    <text x="639" y="352" class="t-body muted">適合「修這個、查這個、先看看多大」</text>
  </g>

  <!-- Section B: roles table -->
  <g>
    <text x="60" y="406" class="t-h2 ink">模型角色 ROLE → MODEL</text>
    <!-- header -->
    <g class="t-role muted">
      <text x="60" y="432">ROLE</text><text x="300" y="432">CHIMERA</text><text x="660" y="432">CHIMERA-VITE</text>
    </g>
    <line x1="60" y1="442" x2="1020" y2="442" class="line"/>
    <!-- rows -->
    <g class="t-tbl">
      <g><text x="60" y="468" class="t-role ink">default 主迴圈</text>
         <text x="300" y="468" class="t-mono ink">zai/glm-5.3:max</text>
         <text x="660" y="468" class="t-mono ink">zai/glm-5.3-flash:high</text></g>
      <line x1="60" y1="482" x2="1020" y2="482" class="line"/>
      <g><text x="60" y="508" class="t-role ink">slow / @heavy 深度</text>
         <text x="300" y="508" class="t-mono muted">— (本身即 max)</text>
         <text x="660" y="508" class="t-mono ink">zai/glm-5.3:max (advisor:true)</text></g>
      <line x1="60" y1="522" x2="1020" y2="522" class="line"/>
      <g><text x="60" y="548" class="t-role ink">task/smol/tiny workers</text>
         <text x="300" y="548" class="t-mono ink">zai/glm-5.3-flash</text>
         <text x="660" y="548" class="t-mono ink">zai/glm-5.3-flash</text></g>
      <line x1="60" y1="562" x2="1020" y2="562" class="line"/>
      <g><text x="60" y="588" class="t-role ink">vision / vision2 視覺</text>
         <text x="300" y="588" class="t-mono ink">opencode-go/muse-spark-1.2</text>
         <text x="660" y="588" class="t-mono ink">opencode-go/muse-spark-1.2</text></g>
      <line x1="60" y1="602" x2="1020" y2="602" class="line"/>
      <g><text x="60" y="628" class="t-role ink">designer 設計</text>
         <text x="300" y="628" class="t-mono ink">zai/glm-5.3:max</text>
         <text x="660" y="628" class="t-mono ink">zai/glm-5.3:max</text></g>
      <line x1="60" y1="642" x2="1020" y2="642" class="line"/>
      <g><text x="60" y="668" class="t-role ink">advisor 顧問</text>
         <text x="300" y="668" class="t-mono ink">devin/swe-1-7:max (免費,旁觀每回合)</text>
         <text x="660" y="668" class="t-mono ink">devin/swe-1-7:max (同)</text></g>
      <line x1="60" y1="682" x2="1020" y2="682" class="line"/>
      <g><text x="60" y="708" class="t-role ink">端點 models.yml</text>
         <text x="300" y="708" class="t-mono ink">GLM Coding Plan (api.z.ai/api/coding)</text>
         <text x="660" y="708" class="t-mono ink">GLM Coding Plan (同 key 同定義)</text></g>
    </g>
  </g>

  <!-- Section C: commands -->
  <g>
    <text x="60" y="748" class="t-h2 ink">DISCORD 指令 (兩隻相同)</text>
    <g class="t-chip">
      <!-- row 1 -->
      <g><rect x="60" y="764" width="118" height="28" rx="14" class="card"/><text x="119" y="782" text-anchor="middle" class="ink">/models</text></g>
      <g><rect x="186" y="764" width="112" height="28" rx="14" class="card"/><text x="242" y="782" text-anchor="middle" class="ink">/agents</text></g>
      <g><rect x="306" y="764" width="122" height="28" rx="14" class="card"/><text x="367" y="782" text-anchor="middle" class="ink">/thinking</text></g>
      <g><rect x="436" y="764" width="106" height="28" rx="14" class="card"/><text x="489" y="782" text-anchor="middle" class="ink">/cancel</text></g>
      <g><rect x="550" y="764" width="140" height="28" rx="14" class="card"/><text x="620" y="782" text-anchor="middle" class="ink">/cancel-all</text></g>
      <g><rect x="698" y="764" width="96" height="28" rx="14" class="card"/><text x="746" y="782" text-anchor="middle" class="ink">/reset</text></g>
      <g><rect x="802" y="764" width="104" height="28" rx="14" class="card"/><text x="854" y="782" text-anchor="middle" class="ink">/remind</text></g>
      <g><rect x="914" y="764" width="96" height="28" rx="14" class="card"/><text x="962" y="782" text-anchor="middle" class="ink">/auth</text></g>
      <!-- row 2 -->
      <g><rect x="60" y="800" width="118" height="28" rx="14" class="card"/><text x="119" y="818" text-anchor="middle" class="ink">/usage</text></g>
      <g><rect x="186" y="800" width="158" height="28" rx="14" class="card"/><text x="265" y="818" text-anchor="middle" class="ink">/export-thread</text></g>
    </g>
    <text x="60" y="856" class="t-body muted">/models → 339 模型分頁選單　·　/agents → Default ⇄ Plan (同 thread 重規劃)　·　/thinking → 5 檔深度</text>
    <text x="60" y="876" class="t-body muted">/reset = 重開 session;開大活先 /reset 或開新 thread</text>
  </g>

  <!-- Section D: keywords + modes -->
  <g>
    <text x="60" y="916" class="t-h2 ink">MAGIC KEYWORDS (散文中全小寫獨立單字,該回生效)</text>
    <g>
      <rect x="60" y="932" width="300" height="64" rx="8" class="card"/>
      <text x="76" y="954" class="t-chip accent">ultrathink</text>
      <text x="76" y="976" class="t-body muted">多步細審;chimera 已 max 無感,vite 停 high</text>

      <rect x="372" y="932" width="300" height="64" rx="8" class="card"/>
      <text x="388" y="954" class="t-chip accent">orchestrate</text>
      <text x="388" y="976" class="t-body muted">拆解 → 平行派 flash 工人 → 逐段驗證</text>

      <rect x="684" y="932" width="336" height="64" rx="8" class="card"/>
      <text x="700" y="954" class="t-chip accent">workflowz</text>
      <text x="700" y="976" class="t-body muted">eval kernel 確定性工作流 (大調查/遷移/對抗審查)</text>
    </g>

    <text x="60" y="1032" class="t-h2 ink">行為模式 (AGENTS.md 慣例,兩隻皆有)</text>
    <g>
      <rect x="60" y="1048" width="300" height="64" rx="8" class="card"/>
      <text x="76" y="1070" class="t-chip ink">Direct</text><text x="140" y="1070" class="t-body muted">(預設)</text>
      <text x="76" y="1092" class="t-body muted">做完回報,一次來回</text>

      <rect x="372" y="1048" width="300" height="64" rx="8" class="card"/>
      <text x="388" y="1070" class="t-chip ink">Ralph</text><text x="438" y="1070" class="t-body muted">「keep going / 持續做」</text>
      <text x="388" y="1092" class="t-body muted">循環驗證到全部子任務完成</text>

      <rect x="684" y="1048" width="336" height="64" rx="8" class="card"/>
      <text x="700" y="1070" class="t-chip ink">Interview</text><text x="772" y="1070" class="t-body muted">「問我 / ask me」</text>
      <text x="700" y="1092" class="t-body muted">一次一問到清楚才做 (僅對人類)</text>
    </g>
  </g>

  <!-- Section E: escalation path -->
  <g>
    <text x="60" y="1156" class="t-h2 ink">深度升級路徑 — 人類自行呼叫,bot 不搶答不自動呼叫</text>
    <!-- node 1 -->
    <rect x="60" y="1180" width="270" height="88" rx="10" class="card"/>
    <text x="195" y="1208" text-anchor="middle" class="t-chip ink">flash 快答</text>
    <text x="195" y="1230" text-anchor="middle" class="t-body muted">@chimera-vite 主迴圈</text>
    <text x="195" y="1250" text-anchor="middle" class="t-body muted">日常任務 · 95% 流量</text>
    <!-- arrow 1 -->
    <line x1="338" y1="1224" x2="392" y2="1224" stroke="#eb6c36" stroke-width="2" marker-end="url(#arr)"/>
    <text x="365" y="1210" text-anchor="middle" class="t-body muted">深度</text>
    <!-- node 2 -->
    <rect x="398" y="1180" width="270" height="88" rx="10" class="card"/>
    <text x="533" y="1208" text-anchor="middle" class="t-chip ink">@heavy 閉門深度</text>
    <text x="533" y="1230" text-anchor="middle" class="t-body muted">vite 內 subagent · glm-5.3:max</text>
    <text x="533" y="1250" text-anchor="middle" class="t-body muted">一次性 · 摘要進出 · 快派</text>
    <!-- arrow 2 -->
    <line x1="676" y1="1224" x2="730" y2="1224" stroke="#eb6c36" stroke-width="2" marker-end="url(#arr)"/>
    <text x="703" y="1210" text-anchor="middle" class="t-body muted">討論</text>
    <!-- node 3 (focal) -->
    <rect x="736" y="1180" width="284" height="88" rx="10" fill="#fff6ef" stroke="#eb6c36" stroke-width="1.6"/>
    <text x="878" y="1208" text-anchor="middle" class="t-chip accent">@chimera 對話式深度</text>
    <text x="878" y="1230" text-anchor="middle" class="t-body muted">fleet 共享重腦 · max 全程在場</text>
    <text x="878" y="1250" text-anchor="middle" class="t-body muted">可來回討論 · context 完整</text>
  </g>

  <!-- Footer discipline -->
  <g>
    <line x1="60" y1="1300" x2="1020" y2="1300" class="line"/>
    <text x="60" y="1328" class="t-h2 ink">艦隊紀律 (12/12 bots 一致)</text>
    <text x="60" y="1354" class="t-body muted">① Discord mentions-only — 沒被 @ 不搶答　　② Anti-Loop — 不主動 @ 其他 bot;被委派 → 執行 → 回報一次 → 停;bot 回覆一律忽略</text>
    <text x="60" y="1376" class="t-body muted">③ 委派只能由人類發起 (「叫 @XXX 做」)　　④ 收 bot 任務:立即執行不反問,缺資訊自行假設並註記</text>
    <text x="60" y="1412" class="t-mono muted">lcn-chimera · max_sessions=3 · 全 max 　　　　lcn-chimera-vite · max_sessions=10 · flash+heavy · advisor devin swe-1.7 (free)</text>
    <text x="60" y="1436" class="t-mono muted">provider: zai = GLM Coding Plan · vision: muse-spark · generated 2026-08-28 · omp 18.0.5 · openab 0.10.0</text>
  </g>
</svg>
