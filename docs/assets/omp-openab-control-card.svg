<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <style>
      text { font-family: "Noto Sans CJK TC","PingFang TC","Microsoft JhengHei","DejaVu Sans",sans-serif; }
      .t   { fill:#c0caf5; }
      .mut { fill:#8b93b8; }
      .dim { fill:#5b6389; }
      .ok  { fill:#9ece6a; }
      .wr  { fill:#e0af68; }
      .er  { fill:#f7768e; }
      .cmd { font-size:14px; font-weight:700; fill:#c0caf5; }
      .d   { font-size:11.5px; fill:#8b93b8; }
      .hd  { font-size:14px; font-weight:700; }
    </style>
  </defs>

  <rect width="900" height="620" rx="16" fill="#0d0f17"/>
  <rect x="1" y="1" width="898" height="618" rx="15" fill="none" stroke="#2a2f3f"/>

  <!-- header -->
  <text x="40" y="46" font-size="26" font-weight="700" class="t">omp × openab 控制面</text>
  <text x="40" y="72" font-size="13" fill="#7aa2f7">k3d openab fleet · 8 bots · 2026-08-20</text>
  <rect x="690" y="20" width="176" height="30" rx="8" fill="#1a1f2e" stroke="#7aa2f7"/>
  <text x="778" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#7aa2f7">omp 17.3.8</text>
  <rect x="690" y="56" width="176" height="24" rx="8" fill="#161a27"/>
  <text x="778" y="72" text-anchor="middle" font-size="11" class="mut">openab-fork ae21db4</text>
  <line x1="36" y1="92" x2="864" y2="92" stroke="#232839"/>

  <!-- column headers -->
  <rect x="36"  y="106" width="286" height="26" rx="6" fill="#161a27" stroke="#7aa2f7"/>
  <text x="48"  y="124" class="hd" fill="#7aa2f7">A · Discord 指令(該 thread)</text>
  <rect x="340" y="106" width="268" height="26" rx="6" fill="#161a27" stroke="#bb9af7"/>
  <text x="352" y="124" class="hd" fill="#bb9af7">B · 訊息內控制(omp 解析)</text>
  <rect x="628" y="106" width="236" height="26" rx="6" fill="#161a27" stroke="#9ece6a"/>
  <text x="640" y="124" class="hd" fill="#9ece6a">C · 部署端(營運)</text>

  <!-- A rows -->
  <g>
    <text x="40" y="168" class="ok" font-size="14">✓</text><text x="58" y="168" class="cmd">/models</text>
    <text x="150" y="168" font-size="11.5" class="t">換模型 · 分頁選單 · 即時</text>
    <text x="58" y="185" class="d">經 set_config_option 套用於該 thread</text>

    <text x="40" y="230" class="ok" font-size="14">✓</text><text x="58" y="230" class="cmd">/agents</text>
    <rect x="128" y="217" width="44" height="17" rx="4" fill="#1f2b3d"/>
    <text x="150" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#7dcfff">NEW</text>
    <text x="182" y="230" font-size="11.5" class="t">Default / Plan(唯讀規劃)</text>
    <text x="58" y="247" class="d">Plan:先出計畫 · 限讀取 · 禁再委派</text>

    <text x="40" y="292" class="ok" font-size="14">✓</text><text x="58" y="292" class="cmd">/cancel · /cancel-all</text>
    <text x="58" y="309" class="d">中止本 turn / 連 buffer 一起清</text>

    <text x="40" y="354" class="ok" font-size="14">✓</text><text x="58" y="354" class="cmd">/reset</text>
    <text x="130" y="354" font-size="11.5" class="t">新 session(TTL 24h)</text>
    <text x="58" y="371" class="d">/remind 提醒 · /export-thread 匯出</text>

    <text x="40" y="416" class="wr" font-size="14">⚠</text><text x="58" y="416" class="cmd">/auth · /usage</text>
    <text x="58" y="433" class="d">走 kiro 系通道 · omp bot 無效</text>

    <text x="40" y="478" class="dim" font-size="11.5">訊息裡打 omp 的 /指令 = 純文字</text>
    <text x="40" y="494" class="dim" font-size="11.5">(實測:ACP headless 不攔截)</text>
  </g>

  <!-- B rows -->
  <g>
    <text x="344" y="168" fill="#bb9af7" font-size="14">✦</text><text x="362" y="168" class="cmd">ultrathink</text>
    <text x="362" y="185" class="d">該 turn 拉滿推理深度(獨立單字)</text>

    <text x="344" y="230" fill="#bb9af7" font-size="14">✦</text><text x="362" y="230" class="cmd">orchestrate</text>
    <text x="362" y="247" class="d">多 subagent 並行編排契約</text>

    <text x="344" y="292" fill="#bb9af7" font-size="14">✦</text><text x="362" y="292" class="cmd">workflowz</text>
    <text x="362" y="309" class="d">eval kernel 固定流程 · 廣域任務</text>

    <text x="344" y="354" fill="#bb9af7" font-size="14">✦</text><text x="362" y="354" class="cmd">[[ws:@alias]] [[title:]]</text>
    <text x="362" y="371" class="d">openab 層 · 僅 session 第一則訊息</text>

    <text x="344" y="416" class="er" font-size="14">✗</text><text x="362" y="416" class="cmd">/斜線指令</text>
    <text x="362" y="433" class="d">僅 TUI 有效 · 訊息中不執行</text>

    <text x="344" y="478" class="dim" font-size="11.5">✦ = 魔術關鍵字,per-turn 生效</text>
    <text x="344" y="494" class="dim" font-size="11.5">小寫獨立單字,程式碼內不觸發</text>
  </g>

  <!-- C rows -->
  <g>
    <text x="632" y="168" fill="#9ece6a" font-size="13">▸</text><text x="648" y="168" font-size="12.5" font-weight="700" class="t">args · --model --thinking</text>
    <text x="648" y="185" class="d">values.yaml configToml 固定</text>

    <text x="632" y="230" fill="#9ece6a" font-size="13">▸</text><text x="648" y="230" font-size="12.5" font-weight="700" class="t">PI_SMOL_MODEL=mimo-v2.5</text>
    <text x="648" y="247" class="d">env + inherit_env 白名單</text>

    <text x="632" y="292" fill="#9ece6a" font-size="13">▸</text><text x="648" y="292" font-size="12.5" font-weight="700" class="t">models.yml</text>
    <text x="648" y="309" class="d">CM openab-pi-z-models 掛載</text>

    <text x="632" y="354" fill="#9ece6a" font-size="13">▸</text><text x="648" y="354" font-size="12.5" font-weight="700" class="t">~/.omp/agent/agents/*.md</text>
    <text x="648" y="371" class="d">自訂 subagent · 人格+@role</text>

    <text x="632" y="416" fill="#9ece6a" font-size="13">▸</text><text x="648" y="416" font-size="12.5" font-weight="700" class="t">omp @ PVC · 17.3.8</text>
    <text x="648" y="433" class="d">fork → build.sh → k3d import</text>

    <text x="632" y="478" class="dim" font-size="11.5">C 不開放 Discord = 刻意邊界</text>
    <text x="632" y="494" class="dim" font-size="11.5">角色/成本/版本由營運端釘</text>
  </g>

  <!-- footer -->
  <rect x="36" y="524" width="828" height="64" rx="8" fill="#141826"/>
  <text x="52" y="548" font-size="12.5" fill="#a9b1d6">2026-08-20 修復:mecrivain 401 ← inherit_env 漏 ZAI_API_KEY(key 有效)· /agents → mode · smol → mimo-v2.5</text>
  <text x="52" y="570" font-size="11.5" class="dim">分工:A 給聊天使用者(模型/模式)· B 給即時微調(推理強度)· C 給營運(角色/成本/後端版本)</text>
</svg>
